name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Run tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 300 pnpm test
          RC=$?
          set -e
          # 124 = timeout killed vitest — a real failure, never a silent pass.
          if [ $RC -eq 124 ]; then echo "::error::vitest exceeded the 300s timeout"; fi
          exit $RC
      - name: Run P11 business hardening tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 300 npx vitest run src/__tests__/pair-p11.test.ts src/__tests__/pair-p11-r1.test.ts src/__tests__/pair-p11-r2.test.ts src/__tests__/pair-p11-r3.test.ts src/__tests__/pair-p11-r4.test.ts src/__tests__/pair-p11-r5.test.ts src/__tests__/pair-p11-r6.test.ts
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::P11 tests exceeded the 300s timeout"; fi
          exit $RC
      - name: Run security tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 180 pnpm test -- --grep "security|injection|policy|financial"
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::security tests exceeded the 180s timeout"; fi
          exit $RC

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
